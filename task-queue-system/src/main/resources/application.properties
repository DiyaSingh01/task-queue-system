# Server
server.port=8080

# Database - MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/taskqueuedb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Task Queue Configuration
taskqueue.worker.thread-count=5
taskqueue.worker.poll-interval-ms=1000
taskqueue.retry.max-attempts=3
taskqueue.retry.initial-delay-ms=2000
taskqueue.retry.multiplier=2.0

# Logging
logging.level.com.taskqueue=DEBUG
logging.level.org.springframework.web=INFO
